name: CD Dokku build

on:
  push:
    branches:
      - main
      - 10-permissions-entites
    paths:
      - 'packages/twenty-front/**'
      - 'packages/twenty-server/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-emails/**'
      - 'packages/twenty-ui/**'
      - 'packages/twenty-sdk/**'
      - 'packages/twenty-client-sdk/**'
      - 'packages/twenty-front-component-renderer/**'
      - 'packages/twenty-docker/twenty/entrypoint.sh'
      - '.dokku/Dockerfile'
      - 'Procfile'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/cd-dokku-build.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dev-by-step/twenty
  SERVER_BASE_URL: https://20.devbystep.fr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${BRANCH_TAG}"
            echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .dokku/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REACT_APP_SERVER_BASE_URL=${{ env.SERVER_BASE_URL }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
